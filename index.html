<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireSign Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; width: 100vw; height: 100vh; overflow: hidden; cursor: none; font-family: sans-serif; }
  #player { position: fixed; inset: 0; background: #000; display: grid; }
  /* --- layout patterns --- */
  #player.layout-full { grid-template-areas: "main"; grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #player.layout-main-bottom { grid-template-areas: "main" "bottom"; grid-template-columns: 1fr; grid-template-rows: 80% 20%; }
  #player.layout-main-top { grid-template-areas: "top" "main"; grid-template-columns: 1fr; grid-template-rows: 20% 80%; }
  #player.layout-split-lr { grid-template-areas: "left right"; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  #player.layout-split-tb { grid-template-areas: "top" "bottom"; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  #player.layout-main-sidebar { grid-template-areas: "main sidebar"; grid-template-columns: 75% 25%; grid-template-rows: 1fr; }
  #player.layout-grid-4 { grid-template-areas: "grid1 grid2" "grid3 grid4"; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

  .zone { position: relative; overflow: hidden; background: #000; border: 0.5px solid rgba(255,255,255,0.04); }
  .zone[data-zone="main"] { grid-area: main; }
  .zone[data-zone="bottom"] { grid-area: bottom; }
  .zone[data-zone="top"] { grid-area: top; }
  .zone[data-zone="left"] { grid-area: left; }
  .zone[data-zone="right"] { grid-area: right; }
  .zone[data-zone="sidebar"] { grid-area: sidebar; }
  .zone[data-zone="grid1"] { grid-area: grid1; }
  .zone[data-zone="grid2"] { grid-area: grid2; }
  .zone[data-zone="grid3"] { grid-area: grid3; }
  .zone[data-zone="grid4"] { grid-area: grid4; }

  .zone .zone-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; animation: fadeIn 0.6s ease; }
  .zone .zone-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
  .zone .zone-empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #222; font-family: monospace; font-size: 12px; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  #telop-wrap { position: fixed; left: 0; right: 0; height: 52px; background: rgba(0,0,0,0.75); border-top: 2px solid #ff6b35; display: none; align-items: center; overflow: hidden; z-index: 100; }
  #telop-text { white-space: nowrap; color: #fff; font-size: 26px; font-weight: 600; will-change: transform; }
  #osd { position: fixed; top: 16px; right: 20px; background: rgba(0,0,0,0.6); color: #ff6b35; font-size: 12px; font-family: monospace; padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,107,53,0.3); z-index: 200; line-height: 1.6; display: none; max-width: 320px; white-space: pre-wrap; }
  #loading { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 300; }
  #loading .logo { font-size: 36px; color: #ff6b35; font-weight: 700; letter-spacing: 4px; margin-bottom: 24px; }
  #loading .logo span { color: #fff; }
  .spinner { width: 40px; height: 40px; border: 3px solid #222; border-top-color: #ff6b35; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  #loading .msg { color: #555; font-size: 13px; margin-top: 16px; font-family: monospace; }
  #error-screen { position: fixed; inset: 0; background: #0a0000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 400; color: #f87171; font-family: monospace; }
  #error-screen .err-icon { font-size: 48px; margin-bottom: 16px; }
  #error-screen .err-msg { font-size: 18px; margin-bottom: 8px; }
  #error-screen .err-sub { font-size: 13px; color: #555; }
</style>
</head>
<body>
<div id="loading">
  <div class="logo">&#128293;Fire<span>Sign</span></div>
  <div class="spinner"></div>
  <div class="msg" id="loading-msg">設定ファイルを読み込み中...</div>
</div>
<div id="error-screen">
  <div class="err-icon">&#9888;</div>
  <div class="err-msg" id="error-msg">コンテンツを読み込めませんでした</div>
  <div class="err-sub" id="error-sub">10秒後に再試行します</div>
</div>
<div id="player"></div>
<div id="telop-wrap"><div id="telop-text"></div></div>
<div id="osd"></div>
<script>
// =============================================================
//  FireSign Player v0.5.0 — マルチゾーンレイアウト対応（画像・動画ともDrive一本化）
//  ★ FIRESIGN_SETTINGS の apiKey だけ書き換えてください
// =============================================================
const FIRESIGN_SETTINGS = {
  driveFolderId: '1PYLYwXCaEsP1v0GNHAk6DLVtWtLjk5HL',
  apiKey: 'AIzaSyAClxeMFbBhLilHVTIOvWJPV7p9Cqy8vog',
  reloadInterval: 60
};

// レイアウトごとのゾーンID一覧
const LAYOUT_ZONES = {
  'full':          ['main'],
  'main-bottom':   ['main', 'bottom'],
  'main-top':      ['top', 'main'],
  'split-lr':      ['left', 'right'],
  'split-tb':      ['top', 'bottom'],
  'main-sidebar':  ['main', 'sidebar'],
  'grid-4':        ['grid1', 'grid2', 'grid3', 'grid4']
};

const FALLBACK_CONFIG = {
  layout: 'full',
  screenIndex: 0,
  telop: { enabled: true, text: '&#128293; FireSign 起動中...', speed: 60, bgColor: 'rgba(0,0,0,0.75)', textColor: '#ffffff', fontSize: 26, position: 'bottom' },
  zones: {
    main: {
      imageDuration: 5,
      fallbackImages: [
        'https://picsum.photos/seed/firesign1/1920/1080',
        'https://picsum.photos/seed/firesign2/1920/1080'
      ]
    }
  },
  loop: true, errorRetry: 10
};

let CONFIG = null;
let ZONES = {}; // zoneId -> Zone instance
let currentLayout = null;

// =============================================================
//  Drive helpers
// =============================================================
async function fetchConfigFromDrive() {
  const { driveFolderId, apiKey } = FIRESIGN_SETTINGS;
  const q = encodeURIComponent("'" + driveFolderId + "' in parents and name='config.json' and trashed=false");
  const searchRes = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&key=' + apiKey);
  if (!searchRes.ok) throw new Error('Drive API ' + searchRes.status);
  const data = await searchRes.json();
  if (!data.files || data.files.length === 0) throw new Error('config.json not found');
  const fileRes = await fetch('https://www.googleapis.com/drive/v3/files/' + data.files[0].id + '?alt=media&key=' + apiKey);
  if (!fileRes.ok) throw new Error('file fetch ' + fileRes.status);
  return await fileRes.json();
}

// Drive上のサブフォルダを名前で検索してIDを返す（見つからなければnull）
async function findSubfolder(parentId, name) {
  const { apiKey } = FIRESIGN_SETTINGS;
  const q = encodeURIComponent(
    "'" + parentId + "' in parents and trashed=false and mimeType='application/vnd.google-apps.folder' and name='" + name + "'"
  );
  const res = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&key=' + apiKey);
  if (!res.ok) throw new Error('Drive API ' + res.status);
  const data = await res.json();
  if (!data.files || data.files.length === 0) return null;
  return data.files[0].id;
}

// フォルダID内の画像・動画を全件取得し、ファイル名でソート
async function listContentInFolder(folderId) {
  const { apiKey } = FIRESIGN_SETTINGS;
  const q = encodeURIComponent(
    "'" + folderId + "' in parents and trashed=false and (mimeType contains 'image/' or mimeType contains 'video/')"
  );
  const res = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name,mimeType)&orderBy=name&pageSize=1000&key=' + apiKey);
  if (!res.ok) throw new Error('Drive API ' + res.status);
  const data = await res.json();
  const files = (data.files || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  // alt=media 経由の直リンクを使用（uc?export=download は大容量ファイルでウイルススキャン確認画面に化けることがあるため）
  return files.map(f => ({
    id: f.id,
    name: f.name,
    type: f.mimeType && f.mimeType.indexOf('video/') === 0 ? 'video' : 'image',
    url: 'https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media&key=' + apiKey
  }));
}

// firesignフォルダ内の "content" フォルダIDをキャッシュして返す
let contentFolderIdCache = undefined; // undefined=未取得, null=存在しない
async function getContentFolderId() {
  if (contentFolderIdCache !== undefined) return contentFolderIdCache;
  contentFolderIdCache = await findSubfolder(FIRESIGN_SETTINGS.driveFolderId, 'content');
  return contentFolderIdCache;
}

// 指定ゾーンのコンテンツ一覧を取得： firesign/content/<zoneId>/ の中身をファイル名順で返す（画像・動画混在可）
async function fetchZoneContent(zoneId) {
  const contentFolderId = await getContentFolderId();
  if (!contentFolderId) return [];
  const zoneFolderId = await findSubfolder(contentFolderId, zoneId);
  if (!zoneFolderId) return [];
  return await listContentInFolder(zoneFolderId);
}

// =============================================================
//  Zone class — 各ゾーンの再生を独立して管理（画像・動画ともDriveから直接再生）
// =============================================================
class Zone {
  constructor(id, container) {
    this.id = id;
    this.container = container;
    this.imgEl = container.querySelector('.zone-img');
    this.videoEl = container.querySelector('.zone-video');
    this.emptyEl = container.querySelector('.zone-empty');
    this.playlist = [];
    this.index = 0;
    this.imageTimer = null;
    this.currentType = null;

    this.videoEl.addEventListener('ended', () => this.next());
    this.videoEl.addEventListener('error', () => { this.imageTimer = setTimeout(() => this.next(), 1000); });
  }

  setPlaylist(list) {
    this.playlist = list || [];
    this.index = 0;
    this._stop();
    if (this.playlist.length === 0) { this._showEmpty(); return; }
    this.emptyEl.style.display = 'none';
    this.playCurrent();
  }

  _showEmpty() {
    this.imgEl.style.display = 'none';
    this.videoEl.style.display = 'none';
    this.videoEl.pause();
    this.emptyEl.style.display = 'flex';
    this.emptyEl.textContent = 'ZONE:' + this.id + ' — コンテンツなし';
  }

  _stop() {
    if (this.imageTimer) { clearTimeout(this.imageTimer); this.imageTimer = null; }
  }

  playCurrent() {
    const item = this.playlist[this.index];
    if (!item) return;
    if (item.type === 'video') this._playVideo(item);
    else this._playImage(item);
  }

  next() {
    if (this.playlist.length === 0) return;
    this.index = (this.index + 1) % this.playlist.length;
    this.playCurrent();
  }

  _playImage(item) {
    this._stop();
    this.videoEl.style.display = 'none';
    this.videoEl.pause();
    const img = new Image();
    img.onload = () => {
      this.imgEl.src = item.url;
      this.imgEl.style.display = 'block';
      this.imgEl.style.animation = 'none'; void this.imgEl.offsetWidth; this.imgEl.style.animation = 'fadeIn 0.6s ease';
      this.imageTimer = setTimeout(() => this.next(), (item.duration || 5) * 1000);
    };
    img.onerror = () => { this.imageTimer = setTimeout(() => this.next(), 1000); };
    img.src = item.url;
  }

  _playVideo(item) {
    this._stop();
    this.imgEl.style.display = 'none';
    this.videoEl.style.display = 'block';
    this.videoEl.muted = true;
    this.videoEl.src = item.url;
    this.videoEl.load();
    this.videoEl.play().catch(() => { this.imageTimer = setTimeout(() => this.next(), 1000); });
  }

  statusText() {
    const item = this.playlist[this.index];
    return this.id + ': ' + (this.index + 1) + '/' + this.playlist.length + ' [' + (item ? item.type : '-') + ']';
  }
}

// =============================================================
//  ゾーン DOM 生成
// =============================================================
function buildZoneDOM(layout) {
  const player = document.getElementById('player');
  player.className = 'layout-' + layout;
  player.innerHTML = '';
  ZONES = {};
  const zoneIds = LAYOUT_ZONES[layout] || LAYOUT_ZONES['full'];
  zoneIds.forEach(zid => {
    const div = document.createElement('div');
    div.className = 'zone';
    div.dataset.zone = zid;
    div.innerHTML =
      '<img class="zone-img" alt="">' +
      '<video class="zone-video" playsinline autoplay muted></video>' +
      '<div class="zone-empty"></div>';
    player.appendChild(div);
    ZONES[zid] = new Zone(zid, div);
  });
  currentLayout = layout;
}

// =============================================================
//  Telop
// =============================================================
let telopAnim = null, telopPos = 0, lastTelopTime = null;
const telopWrap = document.getElementById('telop-wrap');
const telopText = document.getElementById('telop-text');

function initTelop() {
  const t = CONFIG.telop;
  if (!t || !t.enabled) { telopWrap.style.display = 'none'; return; }
  telopWrap.style.display = 'flex';
  telopWrap.style.background = t.bgColor || 'rgba(0,0,0,0.75)';
  telopWrap.style.bottom = t.position === 'top' ? 'auto' : '0';
  telopWrap.style.top = t.position === 'top' ? '0' : 'auto';
  telopText.style.color = t.textColor || '#fff';
  telopText.style.fontSize = (t.fontSize || 26) + 'px';
  telopText.textContent = t.text || '';
  telopPos = window.innerWidth;
  if (telopAnim) cancelAnimationFrame(telopAnim);
  lastTelopTime = null;
  function tick(ts) {
    if (lastTelopTime === null) lastTelopTime = ts;
    telopPos -= (t.speed || 60) * (ts - lastTelopTime) / 1000;
    lastTelopTime = ts;
    if (telopPos < -telopText.offsetWidth) telopPos = window.innerWidth;
    telopText.style.transform = 'translateX(' + telopPos + 'px)';
    telopAnim = requestAnimationFrame(tick);
  }
  telopAnim = requestAnimationFrame(tick);
}

// =============================================================
//  OSD (debug)
// =============================================================
const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loading-msg');
const errorScreen = document.getElementById('error-screen');
const errorMsg = document.getElementById('error-msg');
const errorSub = document.getElementById('error-sub');
const osd = document.getElementById('osd');
let osdVisible = false, retryTimer = null, playing = false;

function updateOSD() {
  if (!osdVisible) return;
  let lines = ['FireSign v0.5.0', 'Layout: ' + (CONFIG ? CONFIG.layout : '-'), 'Screen: #' + (CONFIG ? (CONFIG.screenIndex||0) : 0)];
  Object.values(ZONES).forEach(z => lines.push(z.statusText()));
  osd.textContent = lines.join('\n');
}
setInterval(updateOSD, 1000);

function showError(msg, retryFn) {
  loadingEl.style.display = 'none';
  errorScreen.style.display = 'flex';
  errorMsg.textContent = msg;
  let n = CONFIG ? (CONFIG.errorRetry || 10) : 10;
  errorSub.textContent = n + '秒後に再試行します';
  if (retryTimer) clearInterval(retryTimer);
  retryTimer = setInterval(function() {
    n--; errorSub.textContent = n + '秒後に再試行します';
    if (n <= 0) { clearInterval(retryTimer); errorScreen.style.display = 'none'; retryFn(); }
  }, 1000);
}

// =============================================================
//  ゾーンごとのプレイリスト構築
//  firesign/content/<zoneId>/ 内の画像・動画をファイル名順にそのまま再生する
// =============================================================
async function buildZonePlaylists(cfg) {
  const layout = cfg.layout && LAYOUT_ZONES[cfg.layout] ? cfg.layout : 'full';
  const zoneIds = LAYOUT_ZONES[layout];

  const result = {};
  await Promise.all(zoneIds.map(async (zid) => {
    const zcfg = (cfg.zones && cfg.zones[zid]) || {};
    const dur = zcfg.imageDuration || 5;
    let list = [];
    try {
      const content = await fetchZoneContent(zid);
      if (content.length > 0) {
        list = content.map(f => ({ type: f.type, url: f.url, duration: dur }));
      } else if (zcfg.fallbackImages) {
        list = zcfg.fallbackImages.map(u => ({ type: 'image', url: u, duration: dur }));
      }
    } catch (e) {
      console.warn('Drive content scan failed for zone ' + zid + ':', e.message);
      if (zcfg.fallbackImages) list = zcfg.fallbackImages.map(u => ({ type: 'image', url: u, duration: dur }));
    }
    result[zid] = list;
  }));
  return { layout, playlists: result };
}

function applyConfigAndPlay(cfg, playlists) {
  const layout = cfg.layout && LAYOUT_ZONES[cfg.layout] ? cfg.layout : 'full';
  if (layout !== currentLayout) buildZoneDOM(layout);
  Object.keys(ZONES).forEach(zid => ZONES[zid].setPlaylist(playlists[zid] || []));
  loadingEl.style.display = 'none';
  initTelop();
  playing = true;
}

async function loadAndStart() {
  loadingMsg.textContent = 'Google Drive から config.json を読み込み中...';
  let cfg;
  try {
    cfg = await fetchConfigFromDrive();
  } catch (e) {
    console.warn('Drive config load failed:', e.message);
    loadingMsg.textContent = 'フォールバック設定で起動...';
    cfg = FALLBACK_CONFIG;
  }
  CONFIG = cfg;
  loadingMsg.textContent = 'コンテンツをスキャン中...';
  const { layout, playlists } = await buildZonePlaylists(cfg);
  cfg.layout = layout;
  applyConfigAndPlay(cfg, playlists);

  if (FIRESIGN_SETTINGS.reloadInterval > 0) {
    setInterval(async function() {
      try {
        const newCfg = await fetchConfigFromDrive();
        CONFIG = newCfg;
        const built = await buildZonePlaylists(newCfg);
        newCfg.layout = built.layout;
        applyConfigAndPlay(newCfg, built.playlists);
      } catch (e) { console.warn('reload failed:', e.message); }
    }, FIRESIGN_SETTINGS.reloadInterval * 1000);
  }
}

// =============================================================
//  Keyboard shortcuts (debug / manual control)
// =============================================================
document.addEventListener('keydown', function(e) {
  if (e.key==='d'||e.key==='D') { osdVisible=!osdVisible; osd.style.display=osdVisible?'block':'none'; updateOSD(); }
  else if (e.key==='ArrowRight') { if(retryTimer)clearInterval(retryTimer); errorScreen.style.display='none'; Object.values(ZONES).forEach(z=>z.next()); }
  else if (e.key==='t'||e.key==='T') { telopWrap.style.display=telopWrap.style.display==='none'?'flex':'none'; }
  else if (e.key==='f'||e.key==='F') { if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen(); }
  else if (e.key==='r'||e.key==='R') { loadAndStart(); }
});
document.addEventListener('click', function() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
});

loadAndStart();
</script>
</body>
</html>
