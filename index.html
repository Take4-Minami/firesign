<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireSign Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: none; /* FireTVリモコン操作中はカーソル非表示 */
    font-family: sans-serif;
  }

  /* ── メインコンテンツ表示エリア ── */
  #player {
    position: fixed;
    inset: 0;
    background: #000;
  }

  #media-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain; /* letterbox。fillにすると引き伸ばし */
    display: none;
  }

  #media-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    /* 画像切り替え時のフェードイン */
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── テロップ帯 ── */
  #telop-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 52px;
    background: rgba(0, 0, 0, 0.75);
    border-top: 2px solid #ff6b35;
    display: flex;
    align-items: center;
    overflow: hidden;
    z-index: 100;
    /* JS で show/hide */
    display: none;
  }

  #telop-text {
    white-space: nowrap;
    color: #fff;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.03em;
    /* JS で translateX アニメーション */
    will-change: transform;
  }

  /* ── OSD（画面右上：デバッグ情報）── */
  #osd {
    position: fixed;
    top: 16px;
    right: 20px;
    background: rgba(0,0,0,0.6);
    color: #ff6b35;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid rgba(255,107,53,0.3);
    z-index: 200;
    line-height: 1.6;
    display: none; /* 本番では非表示。D キーで切替 */
  }

  /* ── ローディング表示 ── */
  #loading {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 300;
  }
  #loading .logo {
    font-size: 36px;
    color: #ff6b35;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 24px;
  }
  #loading .logo span { color: #fff; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #222;
    border-top-color: #ff6b35;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .msg {
    color: #555;
    font-size: 13px;
    margin-top: 16px;
    font-family: monospace;
  }

  /* ── エラー表示 ── */
  #error-screen {
    position: fixed;
    inset: 0;
    background: #0a0000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 400;
    color: #f87171;
    font-family: monospace;
  }
  #error-screen .err-icon { font-size: 48px; margin-bottom: 16px; }
  #error-screen .err-msg  { font-size: 18px; margin-bottom: 8px; }
  #error-screen .err-sub  { font-size: 13px; color: #555; }
</style>
</head>
<body>

<!-- ローディング画面 -->
<div id="loading">
  <div class="logo">🔥Fire<span>Sign</span></div>
  <div class="spinner"></div>
  <div class="msg" id="loading-msg">プレイリストを読み込み中...</div>
</div>

<!-- エラー画面 -->
<div id="error-screen">
  <div class="err-icon">⚠</div>
  <div class="err-msg" id="error-msg">コンテンツを読み込めませんでした</div>
  <div class="err-sub" id="error-sub">10秒後に再試行します</div>
</div>

<!-- プレーヤー本体 -->
<div id="player">
  <video id="media-video" playsinline autoplay muted></video>
  <img   id="media-image" alt="">
</div>

<!-- テロップ -->
<div id="telop-wrap">
  <div id="telop-text"></div>
</div>

<!-- OSD（デバッグ） -->
<div id="osd" id="osd"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  FireSign Player  v0.1.0
//  ここの CONFIG を編集して使用してください
// ═══════════════════════════════════════════════════════════

const CONFIG = {

  // ── 画面番号（ビデオウォール用：将来この値で切り出し位置を決める）
  screenIndex: 0,   // 0 始まり。単独表示の場合は 0 のまま

  // ── プレイリスト
  // type: 'video' | 'image'
  // url : Google Drive の直接リンク（後述の形式）または任意のURL
  // duration: 画像の場合の表示秒数（動画は再生時間に従う）
  playlist: [
    {
      type: 'image',
      // テスト用: picsum.photos のランダム写真（1920x1080）
      url:  'https://picsum.photos/seed/firesign1/1920/1080',
      duration: 5
    },
    {
      type: 'image',
      url:  'https://picsum.photos/seed/firesign2/1920/1080',
      duration: 5
    },
    {
      type: 'video',
      // Google Drive 直リンクの作り方:
      //   共有リンク: https://drive.google.com/file/d/FILE_ID/view
      //   直リンク:   https://drive.google.com/uc?export=download&id=FILE_ID
      url:  'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
      duration: null  // 動画は最後まで再生
    },
    {
      type: 'image',
      url:  'https://picsum.photos/seed/firesign3/1920/1080',
      duration: 6
    },
  ],

  // ── テロップ設定
  telop: {
    enabled: true,
    text:    '🏥 本日の外来受付は17:00までです。休診日: 毎週木曜・日曜・祝日。　　お問い合わせ: 03-XXXX-XXXX　　',
    speed:   80,        // px/秒
    bgColor: 'rgba(0,0,0,0.75)',
    textColor: '#ffffff',
    fontSize:  26,      // px
    position: 'bottom'  // 'bottom' | 'top'
  },

  // ── 動作設定
  loop:         true,   // プレイリストを繰り返す
  errorRetry:   10,     // エラー時の再試行秒数
  videoObjectFit: 'contain',  // 'contain'(黒帯あり) | 'cover'(クロップ) | 'fill'(引き伸ばし)
};

// ═══════════════════════════════════════════════════════════
//  Player Engine
// ═══════════════════════════════════════════════════════════

const video   = document.getElementById('media-video');
const image   = document.getElementById('media-image');
const telopWrap = document.getElementById('telop-wrap');
const telopText = document.getElementById('telop-text');
const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loading-msg');
const errorScreen = document.getElementById('error-screen');
const errorMsg = document.getElementById('error-msg');
const errorSub = document.getElementById('error-sub');
const osd = document.getElementById('osd');

let currentIndex = 0;
let telopAnim = null;
let telopPos  = 0;
let lastTelopTime = null;
let osdVisible = false;
let retryTimer = null;

// ── objectFit を設定
video.style.objectFit = CONFIG.videoObjectFit;

// ── テロップ初期化
function initTelop() {
  if (!CONFIG.telop.enabled) return;

  telopWrap.style.display    = 'flex';
  telopWrap.style.background = CONFIG.telop.bgColor;
  telopWrap.style.bottom     = CONFIG.telop.position === 'top' ? 'auto' : '0';
  telopWrap.style.top        = CONFIG.telop.position === 'top' ? '0'    : 'auto';
  telopText.style.color      = CONFIG.telop.textColor;
  telopText.style.fontSize   = CONFIG.telop.fontSize + 'px';
  telopText.textContent      = CONFIG.telop.text;

  telopPos = window.innerWidth;
  telopText.style.transform  = `translateX(${telopPos}px)`;

  function tick(ts) {
    if (lastTelopTime === null) lastTelopTime = ts;
    const dt = (ts - lastTelopTime) / 1000;
    lastTelopTime = ts;

    telopPos -= CONFIG.telop.speed * dt;
    const textWidth = telopText.offsetWidth;
    if (telopPos < -textWidth) {
      telopPos = window.innerWidth;
    }
    telopText.style.transform = `translateX(${telopPos}px)`;
    telopAnim = requestAnimationFrame(tick);
  }
  telopAnim = requestAnimationFrame(tick);
}

// ── OSD 更新
function updateOSD() {
  if (!osdVisible) return;
  const item = CONFIG.playlist[currentIndex];
  osd.innerHTML = `
    <b>FireSign Player</b> v0.1.0<br>
    Screen : #${CONFIG.screenIndex}<br>
    Item   : ${currentIndex + 1} / ${CONFIG.playlist.length}<br>
    Type   : ${item ? item.type : '–'}<br>
    Loop   : ${CONFIG.loop}<br>
    Telop  : ${CONFIG.telop.enabled ? 'ON' : 'OFF'}
  `;
}

// ── エラー表示
function showError(msg, retryFn) {
  loadingEl.style.display = 'none';
  errorScreen.style.display = 'flex';
  errorMsg.textContent = msg;
  let countdown = CONFIG.errorRetry;
  errorSub.textContent = `${countdown}秒後に再試行します`;
  retryTimer = setInterval(() => {
    countdown--;
    errorSub.textContent = `${countdown}秒後に再試行します`;
    if (countdown <= 0) {
      clearInterval(retryTimer);
      errorScreen.style.display = 'none';
      retryFn();
    }
  }, 1000);
}

// ── 次のアイテムへ
function nextItem() {
  currentIndex++;
  if (currentIndex >= CONFIG.playlist.length) {
    if (CONFIG.loop) {
      currentIndex = 0;
    } else {
      // ループなし：最後のアイテムで止まる
      return;
    }
  }
  playItem(currentIndex);
}

// ── アイテム再生
function playItem(index) {
  const item = CONFIG.playlist[index];
  if (!item) return;

  updateOSD();

  if (item.type === 'video') {
    // ── 動画
    image.style.display = 'none';
    video.style.display = 'block';
    video.src = item.url;
    video.load();
    video.play().catch(e => {
      // autoplay blocked → muted で再試行（FireTVは基本 muted なら通る）
      video.muted = true;
      video.play().catch(() => {
        showError('動画を再生できませんでした: ' + item.url, () => playItem(index));
      });
    });

    video.onended = () => nextItem();
    video.onerror = () => {
      showError('動画の読み込みに失敗しました', () => playItem(index));
    };

  } else {
    // ── 画像
    video.style.display = 'none';
    video.pause();
    video.src = '';

    const img = new Image();
    img.onload = () => {
      image.src = item.url;
      image.style.display = 'block';
      // フェードイン再トリガー
      image.style.animation = 'none';
      void image.offsetWidth; // reflow
      image.style.animation = 'fadeIn 0.6s ease';

      setTimeout(() => nextItem(), (item.duration || 5) * 1000);
    };
    img.onerror = () => {
      showError('画像の読み込みに失敗しました', () => playItem(index));
    };
    img.src = item.url;
  }
}

// ── 起動
function start() {
  loadingMsg.textContent = 'プレーヤーを初期化中...';

  if (!CONFIG.playlist || CONFIG.playlist.length === 0) {
    showError('プレイリストが空です', () => location.reload());
    return;
  }

  setTimeout(() => {
    loadingEl.style.display = 'none';
    initTelop();
    playItem(0);
  }, 800);
}

// ── キーボードショートカット（開発・デバッグ用）
// FireTV リモコンでは使わないが、PC テスト時に便利
document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'd': case 'D':
      // OSD トグル
      osdVisible = !osdVisible;
      osd.style.display = osdVisible ? 'block' : 'none';
      updateOSD();
      break;
    case 'ArrowRight':
      // 次のアイテム
      if (retryTimer) clearInterval(retryTimer);
      errorScreen.style.display = 'none';
      nextItem();
      break;
    case 'ArrowLeft':
      // 前のアイテム
      currentIndex = Math.max(0, currentIndex - 2);
      nextItem();
      break;
    case 't': case 'T':
      // テロップ切替
      telopWrap.style.display =
        telopWrap.style.display === 'none' ? 'flex' : 'none';
      break;
    case 'f': case 'F':
      // フルスクリーン
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
      break;
  }
});

// ── FireTV: 画面タップ/クリックでフルスクリーン
document.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
});

start();
</script>
</body>
</html>
